name: OpenAPI Contract Diff

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  contract-diff:
    name: Verify OpenAPI contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stokari_ci
          POSTGRES_USER: stokari_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stokari_ci -d stokari_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://stokari_ci:ci-only-password@localhost:5432/stokari_ci"
      SECRET_KEY: ci-only-insecure-secret-not-for-production
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Generate and compare OpenAPI contract
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          uv run python manage.py spectacular \
            --format openapi-json \
            --file "$temp_dir/openapi.json" \
            --validate \
            --fail-on-warn

          jq -S . "$temp_dir/openapi.json" > "$temp_dir/generated-normalized.json"
          jq -S . contract/openapi.json > "$temp_dir/committed-normalized.json"

          if cmp --silent "$temp_dir/generated-normalized.json" "$temp_dir/committed-normalized.json"; then
            echo "OpenAPI contract is up to date."
          else
            echo "OpenAPI contract is stale. Regenerated schema differs from contract/openapi.json."
            diff -u "$temp_dir/committed-normalized.json" "$temp_dir/generated-normalized.json" || true
            exit 1
          fi
