[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django==6.1.2",
    "django-cors-headers==4.9.0",
    "django-filter==26.2",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
    "pytest>=8.3.0",
    "pytest-django>=4.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
django_settings_module = "backend.settings"
testpaths = ["common", "apps", "backend"]

[tool.uv.sources]
backend = { path = ".", editable = true }
